apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap-service
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "ivolve/simplest"
      labels:
        app: roadmap-service
    spec:
      containers:
      - name: roadmap-service
        image: ivolveacrproj123.azurecr.io/roadmap-service:fd6acc02f2d206e842274097ef164f4f1ff6572f
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-service
  namespace: ivolve
spec:
  selector:
    app: roadmap-service
  ports:
  - port: 8080
    targetPort: 8080
