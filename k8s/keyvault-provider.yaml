apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-kv-provider
  namespace: ivolve
spec:
  provider: azure
  secretObjects:
  - secretName: mysql-secret
    type: Opaque
    data:
    - objectName: mysql-password
      key: password
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "44bd0566-ba6c-4aa6-b4e7-83aa04380e22"
    keyvaultName: "ivolvekvproj123"
    tenantId: "9610af74-00c1-41f7-bbef-348bc8f2738c"
    objects: |
      array:
        - |
          objectName: mysql-password
          objectType: secret
