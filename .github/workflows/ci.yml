name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'terraform/**'
      - 'k8s/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ivolveacrproj123

      # 1. Auth Service
      - name: Build Auth Service
        run: docker build -t ivolveacrproj123.azurecr.io/auth-service:${{ github.sha }} ./auth-service

      - name: Run Trivy Scan on Auth Service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ivolveacrproj123.azurecr.io/auth-service:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Auth Service
        run: docker push ivolveacrproj123.azurecr.io/auth-service:${{ github.sha }}

      # 2. Roadmap Service
      - name: Build Roadmap Service
        run: docker build -t ivolveacrproj123.azurecr.io/roadmap-service:${{ github.sha }} ./roadmap-service

      - name: Run Trivy Scan on Roadmap Service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ivolveacrproj123.azurecr.io/roadmap-service:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Roadmap Service
        run: docker push ivolveacrproj123.azurecr.io/roadmap-service:${{ github.sha }}

      # 3. Frontend Service
      - name: Build Frontend Service
        run: docker build -t ivolveacrproj123.azurecr.io/frontend:${{ github.sha }} ./frontend

      - name: Run Trivy Scan on Frontend Service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ivolveacrproj123.azurecr.io/frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Service
        run: docker push ivolveacrproj123.azurecr.io/frontend:${{ github.sha }}

      # 4. Update Manifests & Git Push
      - name: Update Kubernetes Manifests
        run: |
          sed -i "s|image: ivolveacrproj123.azurecr.io/auth-service:.*|image: ivolveacrproj123.azurecr.io/auth-service:${{ github.sha }}|g" k8s/auth-service.yaml
          sed -i "s|image: ivolveacrproj123.azurecr.io/roadmap-service:.*|image: ivolveacrproj123.azurecr.io/roadmap-service:${{ github.sha }}|g" k8s/roadmap-service.yaml
          sed -i "s|image: ivolveacrproj123.azurecr.io/frontend:.*|image: ivolveacrproj123.azurecr.io/frontend:${{ github.sha }}|g" k8s/frontend-service.yaml

          git config --global user.name 'GitHub Actions GitOps'
          git config --global user.email 'actions@github.com'
          git add k8s/
          git commit -m "Update image tags to ${{ github.sha }}"
          git push
